    <script>

        let isIndonesian = false;

        const paragraphs = document.querySelectorAll("p[data-en]");
        const title = document.getElementById("title");
        const button = document.getElementById("languageButton");


        // Tampilkan English saat pertama dibuka
        paragraphs.forEach(p => {
            p.textContent = p.dataset.en;
        });


        function setLanguage(language) {

            paragraphs.forEach(p => {

                if (language === "en") {
                    p.textContent = p.dataset.en;
                }

                else if (language === "id") {
                    p.textContent = p.dataset.id;
                }

                else if (language === "palembang") {
                    p.textContent = p.dataset.palembang;
                }

                else if (language === "sunda") {
                    p.textContent = p.dataset.sunda;
                }

            });


            if (language === "en") {

                title.textContent =
                    "Hot Tea and Indonesian Clove Cigarette";

                document.documentElement.lang = "en";

            }

            else if (language === "id") {

                title.textContent =
                    "Teh Panas dan Rokok Cengkeh Indonesia";

                document.documentElement.lang = "id";

            }

            else if (language === "sundaLembut") {

                title.textContent =
                    "Teh Panas dan Rokok Cengkeh Indonesia";

                document.documentElement.lang = "id";

            }

            else if (language === "sunda") {

                title.textContent =
                    "Téh Panas sareng Rokok Cengkéh Indonesia";

                document.documentElement.lang = "su";

            }

        }


        function toggleLanguage() {

            isIndonesian = !isIndonesian;

            if (isIndonesian) {

                // English → Indonesia

                paragraphs.forEach(p => {
                    p.textContent = p.dataset.id;
                });

                title.textContent =
                    "Teh Panas dan Rokok Cengkeh Indonesia";

                button.textContent =
                    "🇺🇸 English";

                document.documentElement.lang = "id";

            } else {

                // Indonesia → English

                paragraphs.forEach(p => {
                    p.textContent = p.dataset.en;
                });

                title.textContent =
                    "Hot Tea and Indonesian Clove Cigarette";

                button.textContent =
                    "🇮🇩 Indonesia";

                document.documentElement.lang = "en";
            }
        }

    </script>
